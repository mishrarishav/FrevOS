name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository governance
        run: pnpm run validate:repo

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run typecheck

      - name: Run unit and PostgreSQL integration tests with coverage
        env:
          RYUK_CONTAINER_IMAGE: testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0
        run: pnpm run test:coverage

      - name: Build packages
        run: pnpm run build

      - name: Build pinned non-Production runtime image
        run: docker build --tag frevos-ci:${{ github.sha }} .

      - name: Validate runtime image boundary
        run: >-
          docker run --rm --entrypoint node frevos-ci:${{ github.sha }} -e
          "const fs=require('node:fs');
          if(process.getuid?.()!==1000)throw new Error('runtime user is not node');
          for(const file of ['/opt/frevos/control-plane/dist/main.js','/opt/frevos/control-plane/migrations/0001_identity_workspace.sql','/opt/frevos/control-center/dist/index.html'])fs.accessSync(file);
          for(const path of ['/opt/frevos/control-plane/src','/opt/frevos/control-plane/test','/opt/frevos/control-center/src'])if(fs.existsSync(path))throw new Error('source or test directory present: '+path);
          if(fs.readdirSync('/opt/frevos/control-center/dist/assets').some(name=>name.endsWith('.map')))throw new Error('browser source map present');"

      - name: Audit dependencies
        run: pnpm run audit
