name: frevos-waf

services:
  waf:
    image: ${FREVOS_WAF_IMAGE}
    entrypoint: ["caddy"]
    command: ["run", "--config", "/etc/devsetu/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "${FREVOS_WAF_BIND}:${FREVOS_WAF_PORT}:8080"
    environment:
      FREVOS_WAF_UPSTREAM: ${FREVOS_WAF_UPSTREAM}
      FREVOS_WAF_BASE_PATH: ${FREVOS_WAF_BASE_PATH}
      FREVOS_WAF_MODE: ${FREVOS_WAF_MODE}
      FREVOS_WAF_PARANOIA: ${FREVOS_WAF_PARANOIA}
      FREVOS_WAF_INBOUND_SCORE: ${FREVOS_WAF_INBOUND_SCORE}
      FREVOS_WAF_BODY_LIMIT: ${FREVOS_WAF_BODY_LIMIT}
      FREVOS_WAF_NOFILES_LIMIT: ${FREVOS_WAF_NOFILES_LIMIT}
      FREVOS_WAF_TRANSPORT_LIMIT: ${FREVOS_WAF_TRANSPORT_LIMIT}
      FREVOS_WAF_TRUSTED_PROXIES: ${FREVOS_WAF_TRUSTED_PROXIES}
    volumes:
      - ./deployment/waf/Caddyfile:/etc/devsetu/Caddyfile:ro
    tmpfs:
      - /tmp:size=134217728,mode=1777
      - /data:size=1048576,uid=1000,gid=1000,mode=0700
      - /config:size=1048576,uid=1000,gid=1000,mode=0700
    read_only: true
    cap_drop: ["ALL"]
    # The reviewed upstream binary has this file capability; its bounding bit
    # is required even though our listeners use high ports.
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 384m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: ["backend"]

networks:
  backend:
    external: true
    name: ${FREVOS_WAF_NETWORK}
